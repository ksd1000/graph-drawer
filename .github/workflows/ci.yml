name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc,clang]
    steps:
      - uses: actions/checkout@v4
      - name: start
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFUN=ON
      - name: build
        run: cmake --build build --parallel
      - name: test
        run: ctest --test-dir build --output-on-failure --timeout 180

